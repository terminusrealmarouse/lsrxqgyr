<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远行 Wander - 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">远行 Wander</a>
    <nav>
      <a href="index.html" class="active">首页</a>
      <a href="destinations.html">目的地</a>
      <a href="tips.html">攻略</a>
      <a href="gallery.html">相册</a>
      <a href="contact.html">联系</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <img src="images/hero.jpg" alt="旅行风景">
      <div class="hero-text">
        <h2>世界很大，去看看吧</h2>
        <p>精选三类目的地，帮你找到下一次出发的理由。</p>
        <a class="btn" href="destinations.html">探索目的地</a>
      </div>
    </section>

    <section class="cards">
      <h2 class="section-title">热门目的地</h2>
      <div class="card-grid">
        <article class="card">
          <img src="images/beach.jpg" alt="海岛">
          <div class="card-body"><h3>海岛假期</h3><p>碧海蓝天，慢下来享受阳光与海浪。</p></div>
        </article>
        <article class="card">
          <img src="images/mountain.jpg" alt="山脉">
          <div class="card-body"><h3>山野徒步</h3><p>登高望远，呼吸最干净的空气。</p></div>
        </article>
        <article class="card">
          <img src="images/city.jpg" alt="城市">
          <div class="card-body"><h3>城市漫游</h3><p>穿梭街巷，发现城市的烟火气。</p></div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>远行 Wander · 让每一次出发都值得</p>
  </footer>

</body>
</html>
