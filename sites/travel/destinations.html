<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远行 Wander - 目的地</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">远行 Wander</a>
    <nav>
      <a href="index.html">首页</a>
      <a href="destinations.html" class="active">目的地</a>
      <a href="tips.html">攻略</a>
      <a href="gallery.html">相册</a>
      <a href="contact.html">联系</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <h1>目的地</h1>
      <p>从海岛到雪山，总有一处让你心动。</p>
    </section>

    <section class="cards">
      <div class="card-grid">
        <article class="card">
          <img src="images/beach.jpg" alt="海岛">
          <div class="card-body"><h3>海岛假期</h3><p>碧海蓝天，享受阳光与海浪。</p></div>
        </article>
        <article class="card">
          <img src="images/mountain.jpg" alt="山脉">
          <div class="card-body"><h3>山野徒步</h3><p>登高望远，呼吸干净的空气。</p></div>
        </article>
        <article class="card">
          <img src="images/city.jpg" alt="城市">
          <div class="card-body"><h3>城市漫游</h3><p>穿梭街巷，发现城市烟火气。</p></div>
        </article>
        <article class="card">
          <img src="images/forest.jpg" alt="森林">
          <div class="card-body"><h3>森林秘境</h3><p>在树影与溪流之间慢慢走。</p></div>
        </article>
        <article class="card">
          <img src="images/lake.jpg" alt="湖泊">
          <div class="card-body"><h3>湖畔慢游</h3><p>临水而居，看日出与晚霞。</p></div>
        </article>
        <article class="card">
          <img src="images/desert.jpg" alt="沙漠">
          <div class="card-body"><h3>沙漠星空</h3><p>白天驼铃，夜晚漫天繁星。</p></div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>远行 Wander · 让每一次出发都值得</p>
  </footer>

</body>
</html>
