<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暮岛咖啡 - 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">暮岛咖啡</a>
    <nav>
      <a href="index.html" class="active">首页</a>
      <a href="menu.html">咖啡菜单</a>
      <a href="beans.html">豆单故事</a>
      <a href="space.html">空间</a>
      <a href="contact.html">联系我们</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <img src="images/hero.jpg" alt="咖啡馆吧台">
      <div class="hero-text">
        <h2>一杯咖啡，留住傍晚的安静</h2>
        <p>精品手冲与温暖空间，等你坐下来慢慢喝。</p>
        <a class="btn" href="menu.html">看看菜单</a>
      </div>
    </section>

    <section class="cards">
      <h2 class="section-title">今日主推</h2>
      <div class="card-grid">
        <article class="card">
          <img src="images/latte.jpg" alt="橙花拿铁">
          <h3>橙花拿铁</h3>
          <p>奶香顺滑，带一点橙花的清甜。</p>
        </article>
        <article class="card">
          <img src="images/beans.jpg" alt="精选咖啡豆">
          <h3>单品手冲</h3>
          <p>每周更新的单一产区咖啡豆。</p>
        </article>
        <article class="card">
          <img src="images/interior.jpg" alt="咖啡馆环境">
          <h3>安静空间</h3>
          <p>木质吧台与靠窗座位，适合独处。</p>
        </article>
      </div>
    </section>

    <section class="story">
      <h2 class="section-title">我们的故事</h2>
      <p>暮岛咖啡开在城市的安静角落，我们相信好咖啡值得慢慢等待。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>暮岛咖啡 · 每天 9:00 - 21:00 · 暮岛路 1 号</p>
  </footer>

</body>
</html>
