<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暮岛咖啡 - 咖啡菜单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">暮岛咖啡</a>
    <nav>
      <a href="index.html">首页</a>
      <a href="menu.html" class="active">咖啡菜单</a>
      <a href="beans.html">豆单故事</a>
      <a href="space.html">空间</a>
      <a href="contact.html">联系我们</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <h1>咖啡菜单</h1>
      <p>从经典到创意，每一杯都用心冲煮。</p>
    </section>

    <section class="cards">
      <div class="card-grid">
        <article class="card">
          <img src="images/espresso.jpg" alt="意式浓缩">
          <h3>意式浓缩 <span class="price">¥22</span></h3>
          <p>浓郁醇厚，咖啡风味的起点。</p>
        </article>
        <article class="card">
          <img src="images/latte.jpg" alt="橙花拿铁">
          <h3>橙花拿铁 <span class="price">¥32</span></h3>
          <p>奶香顺滑，带一点橙花的清甜。</p>
        </article>
        <article class="card">
          <img src="images/cold.jpg" alt="海盐冷萃">
          <h3>海盐冷萃 <span class="price">¥34</span></h3>
          <p>冰凉清爽，一点海盐带出回甘。</p>
        </article>
        <article class="card">
          <img src="images/beans.jpg" alt="单品手冲">
          <h3>单品手冲 <span class="price">¥38</span></h3>
          <p>每周更新的单一产区咖啡豆。</p>
        </article>
        <article class="card">
          <img src="images/pastry.jpg" alt="可颂">
          <h3>黄油可颂 <span class="price">¥18</span></h3>
          <p>当日现烤，层层酥脆。</p>
        </article>
        <article class="card">
          <img src="images/interior.jpg" alt="燕麦白">
          <h3>榛果燕麦白 <span class="price">¥34</span></h3>
          <p>植物奶版本，香气更柔和。</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>暮岛咖啡 · 每天 9:00 - 21:00 · 暮岛路 1 号</p>
  </footer>

</body>
</html>
