<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSE 健身工作室</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">PULSE<span>健身</span></h1>
    <nav>
      <a href="#classes">课程</a>
      <a href="#why">优势</a>
      <a href="#join">加入</a>
    </nav>
  </header>

  <main>
    <!-- 大图 + 标题 -->
    <section class="hero">
      <img src="images/hero.jpg" alt="健身房">
      <div class="hero-text">
        <p class="kicker">超越极限</p>
        <h2>今天的汗水，明天的力量</h2>
        <a class="btn" href="#join">免费体验</a>
      </div>
    </section>

    <!-- 课程：图文行 -->
    <section id="classes" class="classes">
      <h2 class="section-title">热门课程</h2>

      <article class="row">
        <img src="images/weights.jpg" alt="力量训练">
        <div class="row-text">
          <h3>力量训练</h3>
          <p>专业教练带练，从入门到进阶，科学增肌减脂。</p>
        </div>
      </article>

      <article class="row reverse">
        <img src="images/run.jpg" alt="燃脂训练">
        <div class="row-text">
          <h3>燃脂 HIIT</h3>
          <p>高强度间歇训练，40 分钟高效燃烧卡路里。</p>
        </div>
      </article>

      <article class="row">
        <img src="images/yoga.jpg" alt="瑜伽">
        <div class="row-text">
          <h3>流瑜伽</h3>
          <p>放松身心、改善体态，适合各个水平的学员。</p>
        </div>
      </article>
    </section>

    <!-- 优势数据 -->
    <section id="why" class="stats">
      <div><strong>20+</strong><span>每周课程</span></div>
      <div><strong>10</strong><span>专业教练</span></div>
      <div><strong>500+</strong><span>会员同行</span></div>
    </section>
  </main>

  <footer id="join" class="site-footer">
    <p>PULSE 健身工作室 · 现在加入，首月免费</p>
  </footer>

</body>
</html>
