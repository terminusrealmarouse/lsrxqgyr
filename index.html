<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暮岛咖啡 - 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部：网站名字和导航 -->
  <header>
    <h1 class="logo">暮岛咖啡 MOOD ISLE</h1>
    <nav>
      <a href="index.html">首页</a>
      <a href="menu.html">咖啡菜单</a>
      <a href="contact.html">联系我们</a>
    </nav>
  </header>

  <!-- 顶部大标题 -->
  <section class="hero">
    <h2>一杯咖啡，留住傍晚的安静</h2>
    <p>暮岛咖啡是一间安静的精品咖啡空间，适合独处、小聚和轻办公。</p>
  </section>

  <!-- 图文结合：每一块都是一张图 + 一段文字 -->
  <section class="item">
    <img src="images/coffee1.svg" alt="今日主推咖啡">
    <div class="text">
      <h3>今日主推</h3>
      <p>橙花拿铁、海盐冷萃、榛果燕麦白，每天为你推荐当季好喝的咖啡。</p>
    </div>
  </section>

  <section class="item">
    <img src="images/coffee2.svg" alt="木质咖啡吧台">
    <div class="text">
      <h3>空间气质</h3>
      <p>低照度灯光、木质吧台、安静靠窗的座位，让人慢下来。</p>
    </div>
  </section>

  <section class="item">
    <img src="images/coffee3.svg" alt="舒适阅读区">
    <div class="text">
      <h3>适合场景</h3>
      <p>独处阅读、朋友小聚、轻办公，都能在这里找到合适的角落。</p>
    </div>
  </section>

  <!-- 底部 -->
  <footer>
    <p>暮岛咖啡 | 使用 HTML + CSS 制作</p>
  </footer>

</body>
</html>
